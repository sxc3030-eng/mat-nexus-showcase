  <text class="detail" x="925" y="750" text-anchor="middle">29 gains · 0 perte</text>
  <text class="detail" x="925" y="780" text-anchor="middle">71 égalités</text>
  <text x="925" y="812" text-anchor="middle" font-size="17" fill="#43e2a3">p = 3.7 × 10⁻⁹ · gain sur ce jeu</text>

