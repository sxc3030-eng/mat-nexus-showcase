  <text class="tiny" x="1494" y="402">100%</text>
  <text class="bar-value" x="1525" y="388" text-anchor="end" fill="#43e2a3">+100 pp</text>
  <text class="bar-label" x="825" y="470">BBH date understanding</text>
  <text class="tiny" x="825" y="495">n=25</text>
  <rect x="1150" y="452" width="330" height="18" rx="9" fill="#173c31"/>
  <rect x="1150" y="452" width="2" height="18" rx="9" fill="#9bb2aa"/>
  <rect x="1150" y="482" width="330" height="18" rx="9" fill="#173c31"/>
  <rect x="1150" y="482" width="52.800000000000004" height="18" rx="9" fill="#43e2a3"/>
  <text class="tiny" x="1494" y="466">0%</text>
  <text class="tiny" x="1494" y="497">16%</text>
  <text class="bar-value" x="1525" y="483" text-anchor="end" fill="#43e2a3">+16 pp</text>
  <text class="bar-label" x="825" y="565">GSM8K</text>
  <text class="tiny" x="825" y="590">n=25</text>
  <rect x="1150" y="547" width="330" height="18" rx="9" fill="#173c31"/>
  <rect x="1150" y="547" width="198" height="18" rx="9" fill="#9bb2aa"/>
  <rect x="1150" y="577" width="330" height="18" rx="9" fill="#173c31"/>
  <rect x="1150" y="577" width="198" height="18" rx="9" fill="#43e2a3"/>
  <text class="tiny" x="1494" y="561">60%</text>
  <text class="tiny" x="1494" y="592">60%</text>
  <text class="bar-value" x="1525" y="578" text-anchor="end" fill="#abd0c1">0 pp</text>
  <text class="bar-label" x="825" y="660">TriviaQA</text>
  <text class="tiny" x="825" y="685">n=25</text>
  <rect x="1150" y="642" width="330" height="18" rx="9" fill="#173c31"/>
  <rect x="1150" y="642" width="92.4" height="18" rx="9" fill="#9bb2aa"/>
  <rect x="1150" y="672" width="330" height="18" rx="9" fill="#173c31"/>
  <rect x="1150" y="672" width="92.4" height="18" rx="9" fill="#43e2a3"/>
  <text class="tiny" x="1494" y="656">28%</text>
  <text class="tiny" x="1494" y="687">28%</text>
  <text class="bar-value" x="1525" y="673" text-anchor="end" fill="#abd0c1">0 pp</text>
  <line x1="825" y1="720" x2="1542" y2="720" stroke="#215846" stroke-width="2"/>
  <text class="tiny" x="825" y="754">Supported: verified deterministic expert layer, +29 pp, zero paired regressions.</text>
  <text class="tiny" x="825" y="782">Not established: separate Nexus gain = 0 pp; MATmem was not exercised.</text>
  <text class="tiny" x="825" y="810">Official prompts, filters and scorers unchanged · no target reuse · no automatic learning.</text>
  <text x="1542" y="856" text-anchor="end" font-size="15" fill="#70b9ff">github.com/sxc3030-eng/mat-nexus-showcase</text>
</svg>
