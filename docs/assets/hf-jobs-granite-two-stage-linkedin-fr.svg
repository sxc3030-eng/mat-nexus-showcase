  <line x1="64" y1="1260" x2="1136" y2="1260" stroke="#215846" stroke-width="2"/>
  <text class="tiny" x="64" y="1290">Établi : couche d'experts déterministes vérifiés, +29 pp et zéro régression appariée.</text>
  <text class="tiny" x="64" y="1318">Non établi : gain séparé de l'orchestration Nexus = 0 pp; MATmem non exercé. Questions fraîches, sans accès aux cibles.</text>
