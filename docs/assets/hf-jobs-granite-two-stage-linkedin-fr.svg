  <rect x="94" y="448" width="650" height="28" rx="14" fill="#173c31"/>
  <rect x="94" y="448" width="487.5" height="28" rx="14" fill="#43e2a3"/>
  <text class="bar-value" x="762" y="470">75%</text>
  <text class="metric" x="925" y="405" text-anchor="middle" fill="#43e2a3">+50 pp</text>
  <text class="detail" x="925" y="440" text-anchor="middle">4 gains · 0 perte</text>
  <text class="detail" x="925" y="470" text-anchor="middle">p = 0.125</text>
  <text x="925" y="504" text-anchor="middle" font-size="18" fill="#ffc967">signal, échantillon insuffisant</text>

  <path d="M600 548 v38" stroke="#43e2a3" stroke-width="4" stroke-linecap="round"/>
  <path d="M588 576 l12 14 12-14" fill="none" stroke="#43e2a3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="64" y="610" width="1072" height="250" rx="24" fill="#0f352a" stroke="#43e2a3" stroke-width="2"/>
  <text class="label" x="94" y="650" fill="#43e2a3">TEST 2 · CONFIRMATION · n=100</text>
  <text class="bar-label" x="94" y="690">LLM seul</text>
  <rect x="94" y="700" width="650" height="28" rx="14" fill="#173c31"/>
  <rect x="94" y="700" width="143" height="28" rx="14" fill="#9bb2aa"/>
  <text class="bar-value" x="762" y="722">22%</text>
  <text class="bar-label" x="94" y="758">Couche d'experts vérifiés</text>
  <rect x="94" y="768" width="650" height="28" rx="14" fill="#173c31"/>
  <rect x="94" y="768" width="331.5" height="28" rx="14" fill="#43e2a3"/>
  <text class="bar-value" x="762" y="790">51%</text>
