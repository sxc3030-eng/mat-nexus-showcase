<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title description">
  <title id="title">Du signal pilote à la confirmation sur 100 questions</title>
  <desc id="description">Granite 3.3 2B passe de 22 % à 51 % avec une couche d'experts déterministes vérifiés sur 100 questions officielles.</desc>
  <rect width="1200" height="1350" fill="#061813"/>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f4fff9; }
    .label { font-size: 18px; font-weight: 500; letter-spacing: 2.2px; }
    .title { font-size: 58px; font-weight: 500; }
    .subtitle { font-size: 23px; fill: #abd0c1; }
    .section { font-size: 24px; font-weight: 500; }
    .bar-label { font-size: 21px; }
    .bar-value { font-size: 22px; font-weight: 500; }
    .metric { font-size: 38px; font-weight: 500; }
    .detail { font-size: 18px; fill: #abd0c1; }
    .tiny { font-size: 15px; fill: #abd0c1; }
  </style>

  <text class="label" x="64" y="68" fill="#43e2a3">MAT NEXUS · MISE À JOUR DES PREUVES</text>
  <g transform="translate(978 34)">
    <rect width="158" height="58" rx="16" fill="#0f352a" stroke="#215846"/>
    <text x="79" y="24" text-anchor="middle" font-size="15" font-weight="500">GPT-5 CODEX</text>
    <text x="79" y="44" text-anchor="middle" class="tiny">SYNTHÈSE</text>
  </g>
  <text class="title" x="64" y="142">Du signal pilote</text>
  <text class="title" x="64" y="207">à la confirmation sur 100 questions</text>
  <text class="subtitle" x="64" y="250">Granite 3.3 2B · Hugging Face Jobs · tâches officielles lm-eval</text>

  <rect x="64" y="290" width="1072" height="240" rx="24" fill="#0b2a21" stroke="#215846" stroke-width="2"/>
  <text class="label" x="94" y="330" fill="#ffc967">TEST 1 · PILOTE · n=8</text>
  <text class="bar-label" x="94" y="370">LLM seul</text>
  <rect x="94" y="380" width="650" height="28" rx="14" fill="#173c31"/>
  <rect x="94" y="380" width="162.5" height="28" rx="14" fill="#9bb2aa"/>
  <text class="bar-value" x="762" y="402">25%</text>
