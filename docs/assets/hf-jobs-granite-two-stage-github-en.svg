<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">MAT Nexus pilot and 100-question confirmation</title>
  <desc id="description">Granite 3.3 2B improves from 22% to 51% with a verified deterministic expert layer on 100 official lm-eval questions.</desc>
  <rect width="1600" height="900" fill="#061813"/>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #f4fff9; }
    .label { font-size: 18px; font-weight: 500; letter-spacing: 2.2px; }
    .title { font-size: 58px; font-weight: 500; }
    .subtitle { font-size: 23px; fill: #abd0c1; }
    .section { font-size: 24px; font-weight: 500; }
    .bar-label { font-size: 21px; }
    .bar-value { font-size: 22px; font-weight: 500; }
    .metric { font-size: 38px; font-weight: 500; }
    .detail { font-size: 18px; fill: #abd0c1; }
    .tiny { font-size: 15px; fill: #abd0c1; }
  </style>

  <text class="label" x="58" y="58" fill="#43e2a3">MAT NEXUS · HUGGING FACE JOBS EVIDENCE</text>
  <g transform="translate(1378 26)"><rect width="164" height="54" rx="15" fill="#0f352a" stroke="#215846"/><text x="82" y="23" text-anchor="middle" font-size="15" font-weight="500">GPT-5 CODEX</text><text x="82" y="42" text-anchor="middle" class="tiny">SYNTHESIS</text></g>
  <text class="title" x="58" y="130">A pilot found the signal.</text>
  <text class="title" x="58" y="194">100 questions confirmed it.</text>
  <text class="subtitle" x="58" y="233">Granite 3.3 2B · official lm-eval tasks · fresh target-blind samples</text>

  <rect x="58" y="278" width="700" height="250" rx="24" fill="#0b2a21" stroke="#215846" stroke-width="2"/>
  <text class="label" x="88" y="318" fill="#ffc967">TEST 1 · PILOT · n=8</text>
  <text class="bar-label" x="88" y="360">LLM alone</text>
  <rect x="88" y="370" width="390" height="28" rx="14" fill="#173c31"/>
  <rect x="88" y="370" width="97.5" height="28" rx="14" fill="#9bb2aa"/>
  <text class="bar-value" x="496" y="392">25%</text>
  <text class="bar-label" x="88" y="428">Verified expert layer</text>
  <rect x="88" y="438" width="390" height="28" rx="14" fill="#173c31"/>
  <rect x="88" y="438" width="292.5" height="28" rx="14" fill="#43e2a3"/>
  <text class="bar-value" x="496" y="460">75%</text>
  <text class="metric" x="650" y="392" text-anchor="middle" fill="#43e2a3">+50 pp</text>
  <text class="detail" x="650" y="432" text-anchor="middle">4 wins · 0 losses</text>
  <text x="650" y="472" text-anchor="middle" font-size="17" fill="#ffc967">p=.125 · inconclusive</text>

  <rect x="58" y="558" width="700" height="260" rx="24" fill="#0f352a" stroke="#43e2a3" stroke-width="2"/>
  <text class="label" x="88" y="598" fill="#43e2a3">TEST 2 · CONFIRMATION · n=100</text>
  <text class="bar-label" x="88" y="640">LLM alone</text>
  <rect x="88" y="650" width="390" height="28" rx="14" fill="#173c31"/>
  <rect x="88" y="650" width="85.8" height="28" rx="14" fill="#9bb2aa"/>
  <text class="bar-value" x="496" y="672">22%</text>
  <text class="bar-label" x="88" y="708">Verified expert layer</text>
  <rect x="88" y="718" width="390" height="28" rx="14" fill="#173c31"/>
  <rect x="88" y="718" width="198.9" height="28" rx="14" fill="#43e2a3"/>
  <text class="bar-value" x="496" y="740">51%</text>
  <text class="metric" x="650" y="672" text-anchor="middle" fill="#43e2a3">+29 pp</text>
  <text class="detail" x="650" y="712" text-anchor="middle">29 wins · 0 losses</text>
  <text x="635" y="752" text-anchor="middle" font-size="15" fill="#43e2a3">p=3.7×10⁻⁹ · paired gain</text>

  <text class="section" x="825" y="310">Confirmation by task</text>
  <rect x="1210" y="291" width="14" height="14" rx="7" fill="#9bb2aa"/><text class="tiny" x="1234" y="304">LLM alone</text>
  <rect x="1360" y="291" width="14" height="14" rx="7" fill="#43e2a3"/><text class="tiny" x="1384" y="304">with layer</text>
